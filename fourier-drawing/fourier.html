<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fourier Drawing</title>
<style>
  :root { --bg:#0a1128; --panel:#0e1733; --line:#2a3560; --fg:#dfe6ff; --dim:#8a96c4; --acc:#7c5cff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow:hidden; }
  #app { display:flex; flex-direction:column; height:100%; }
  #bar { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; padding:8px 12px;
    background:var(--panel); border-bottom:1px solid var(--line); }
  .row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  button { background:#1a2552; color:var(--fg); border:1px solid var(--line); border-radius:6px;
    padding:5px 10px; font:inherit; cursor:pointer; }
  button:hover { background:#243272; border-color:var(--acc); }
  label { color:var(--dim); display:inline-flex; align-items:center; gap:6px; }
  input[type=range] { width:120px; accent-color:var(--acc); }
  input[type=checkbox] { accent-color:var(--acc); }
  #stage { flex:1; position:relative; min-height:0; }
  #cv { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:crosshair; }
  #hint { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); color:var(--dim);
    font-size:16px; text-align:center; pointer-events:none; padding:0 20px; }
  #status { position:absolute; left:12px; bottom:10px; color:var(--dim); font-size:12px;
    background:rgba(10,17,40,.75); padding:4px 8px; border-radius:6px; pointer-events:none; }
  #home { position:fixed; right:12px; bottom:12px; z-index:20; display:inline-flex; align-items:center; gap:6px;
    padding:7px 12px; background:#1a2552; color:var(--fg); border:1px solid var(--line); border-radius:8px;
    text-decoration:none; font-size:13px; }
  #home:hover, #home:focus-visible { background:#243272; border-color:var(--acc); outline:none; }
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <div class="row">
      <button id="clear">Clear</button>
      <button data-preset="heart">Heart</button>
      <button data-preset="star">Star</button>
      <button data-preset="infinity">Infinity</button>
      <button data-preset="trefoil">Trefoil</button>
    </div>
    <label>Circles <input id="nCirc" type="range" min="1" max="512" value="512"> <span id="nCircV">512</span></label>
    <label>Speed <input id="speed" type="range" min="1" max="100" value="30"></label>
    <label><input id="showCircles" type="checkbox" checked> circles</label>
    <label><input id="showOrig" type="checkbox"> original</label>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hint">Draw any shape with mouse or finger.<br>Release to see it rebuilt by rotating circles.</div>
    <div id="status"></div>
  </div>
</div>

<a id="home" href="../index.html" title="Back to all side projects">&#8962; Home</a>
<script>
"use strict";
/* Fourier drawing: freehand path -> resample -> DFT -> epicycle animation. */
const N = 512;                       // resampled point count = number of coefficients
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const $ = id => document.getElementById(id);

let W = 0, H = 0, dpr = 1;
let raw = [];                        // freehand points {x,y} relative to canvas centre
let drawing = false;
let coefs = [];                      // {k, re, im, amp, phase} sorted by amp desc
let original = [];                   // resampled points (for the "original" overlay)
let t = 0;                           // animation phase, 0..2π per loop
let trail = [];                      // {x,y,t}
let last = 0;

function resize() {
  dpr = window.devicePixelRatio || 1;
  const r = cv.getBoundingClientRect();
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
}
window.addEventListener("resize", resize);
resize();

/* ---- geometry / DFT ---- */
function resample(pts, n) {
  const p = pts.concat([pts[0]]);              // close the loop
  const cum = [0];
  for (let i = 1; i < p.length; i++) cum.push(cum[i-1] + Math.hypot(p[i].x-p[i-1].x, p[i].y-p[i-1].y));
  const total = cum[cum.length-1];
  if (total < 1e-6) return null;
  const out = []; let j = 1;
  for (let i = 0; i < n; i++) {
    const d = total * i / n;
    while (j < cum.length-1 && cum[j] < d) j++;
    const seg = cum[j] - cum[j-1] || 1, u = (d - cum[j-1]) / seg;
    out.push({ x: p[j-1].x + (p[j].x-p[j-1].x)*u, y: p[j-1].y + (p[j].y-p[j-1].y)*u });
  }
  return out;
}

function dft(pts) {
  const n = pts.length, out = [];
  const cosT = new Float64Array(n), sinT = new Float64Array(n);
  for (let i = 0; i < n; i++) { cosT[i] = Math.cos(2*Math.PI*i/n); sinT[i] = Math.sin(2*Math.PI*i/n); }
  for (let f = 0; f < n; f++) {
    const k = f <= n/2 ? f : f - n;            // frequencies -n/2+1 .. n/2
    let re = 0, im = 0;
    for (let i = 0; i < n; i++) {
      const idx = ((f * i) % n);               // angle = 2π f i / n
      const c = cosT[idx], s = -sinT[idx];     // e^{-iθ}
      re += pts[i].x * c - pts[i].y * s;
      im += pts[i].x * s + pts[i].y * c;
    }
    re /= n; im /= n;
    out.push({ k, re, im, amp: Math.hypot(re, im), phase: Math.atan2(im, re) });
  }
  return out.sort((a, b) => b.amp - a.amp);
}

function setShape(pts) {
  const rs = resample(pts, N);
  if (!rs) return;
  original = rs;
  coefs = dft(rs);
  t = 0; trail = [];
  $("hint").style.display = "none";
  updateStatus();
}

/* ---- presets (parametric, in canvas-centre coordinates) ---- */
function preset(name) {
  const s = Math.min(W, H) * 0.35, pts = [], M = 400;
  for (let i = 0; i < M; i++) {
    const u = 2 * Math.PI * i / M; let x, y;
    if (name === "heart") { x = 16*Math.sin(u)**3; y = -(13*Math.cos(u) - 5*Math.cos(2*u) - 2*Math.cos(3*u) - Math.cos(4*u)); x *= s/17; y *= s/17; }
    else if (name === "infinity") { const d = 1 + Math.sin(u)**2; x = 1.3*s*Math.cos(u)/d; y = 1.3*s*Math.sin(u)*Math.cos(u)/d; }
    else if (name === "trefoil") { x = s*(Math.sin(u) + 2*Math.sin(2*u))/3; y = s*(Math.cos(u) - 2*Math.cos(2*u))/3; }
    else if (name === "star") {                // 5-point star polyline, interpolated
      const v = (i / M) * 10, a = Math.floor(v), f = v - a;
      const P = j => { const ang = -Math.PI/2 + j * Math.PI/5, r = j % 2 ? s*0.42 : s*1.1; return [r*Math.cos(ang), r*Math.sin(ang)]; };
      const A = P(a % 10), B = P((a+1) % 10); x = A[0] + (B[0]-A[0])*f; y = A[1] + (B[1]-A[1])*f;
    }
    pts.push({ x, y });
  }
  raw = pts; setShape(pts);
}

/* ---- epicycles ---- */
function nActive() { return Math.min(+$("nCirc").value, coefs.length); }

function epicycles(tt, n, draw) {
  let x = 0, y = 0;
  for (let i = 0; i < n; i++) {
    const c = coefs[i], a = c.k * tt + c.phase;
    const nx = x + c.amp * Math.cos(a), ny = y + c.amp * Math.sin(a);
    if (draw && c.amp > 0.3) {
      ctx.beginPath(); ctx.arc(x, y, c.amp, 0, 2*Math.PI);
      ctx.strokeStyle = "rgba(138,150,196,0.28)"; ctx.lineWidth = 1; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(nx, ny);
      ctx.strokeStyle = "rgba(223,230,255,0.55)"; ctx.stroke();
    }
    x = nx; y = ny;
  }
  return { x, y };
}

function updateStatus() {
  $("nCircV").textContent = $("nCirc").value;
  $("status").textContent = coefs.length ? `${nActive()} of ${coefs.length} circles` : "";
}

/* ---- main loop ---- */
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.translate(W / 2, H / 2);
  ctx.lineJoin = "round"; ctx.lineCap = "round";

  if (drawing || !coefs.length) {
    if (raw.length > 1) {
      ctx.beginPath(); ctx.moveTo(raw[0].x, raw[0].y);
      for (const p of raw) ctx.lineTo(p.x, p.y);
      ctx.strokeStyle = "#7c5cff"; ctx.lineWidth = 3; ctx.stroke();
    }
  } else {
    const n = nActive();
    if ($("showOrig").checked) {
      ctx.beginPath(); ctx.moveTo(original[0].x, original[0].y);
      for (const p of original) ctx.lineTo(p.x, p.y);
      ctx.closePath(); ctx.strokeStyle = "rgba(124,92,255,0.35)"; ctx.lineWidth = 2; ctx.stroke();
    }
    const period = 2 * Math.PI;
    t += dt * (0.05 + +$("speed").value / 100 * 1.2);
    // pen position
    ctx.save();
    const pen = epicycles(t, n, $("showCircles").checked);
    ctx.restore();
    trail.push({ x: pen.x, y: pen.y, t });
    while (trail.length > 1 && trail[0].t < t - period) trail.shift();
    // trail with fade (older -> dimmer)
    const L = trail.length, chunks = 10;
    ctx.lineWidth = 2.5;
    for (let c = 0; c < chunks; c++) {
      const a = Math.floor(L * c / chunks), b = Math.min(L, Math.floor(L * (c+1) / chunks) + 1);
      if (b - a < 2) continue;
      ctx.beginPath(); ctx.moveTo(trail[a].x, trail[a].y);
      for (let i = a + 1; i < b; i++) ctx.lineTo(trail[i].x, trail[i].y);
      ctx.strokeStyle = `rgba(255,214,102,${0.15 + 0.85 * (c + 1) / chunks})`; ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(pen.x, pen.y, 3.5, 0, 2*Math.PI); ctx.fillStyle = "#fff"; ctx.fill();
  }
  requestAnimationFrame(frame);
}

/* ---- input ---- */
function pos(e) {
  const r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left - r.width / 2, y: e.clientY - r.top - r.height / 2 };
}
cv.addEventListener("pointerdown", e => {
  cv.setPointerCapture(e.pointerId);
  drawing = true; raw = [pos(e)]; coefs = []; original = []; trail = [];
  $("hint").style.display = "none"; updateStatus();
});
cv.addEventListener("pointermove", e => {
  if (!drawing) return;
  const p = pos(e), q = raw[raw.length - 1];
  if (Math.hypot(p.x - q.x, p.y - q.y) >= 1.5) raw.push(p);
});
function endDraw() {
  if (!drawing) return;
  drawing = false;
  if (raw.length > 5) setShape(raw);
  else { raw = []; $("hint").style.display = ""; }
}
cv.addEventListener("pointerup", endDraw);
cv.addEventListener("pointercancel", endDraw);

$("clear").onclick = () => { raw = []; coefs = []; original = []; trail = []; $("hint").style.display = ""; updateStatus(); };
document.querySelectorAll("[data-preset]").forEach(b => b.onclick = () => preset(b.dataset.preset));
$("nCirc").oninput = () => { trail = []; updateStatus(); };

requestAnimationFrame(now => { last = now; frame(now); });
</script>
</body>
</html>
